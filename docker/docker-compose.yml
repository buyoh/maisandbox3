services:
  web:
    image: maisandbox3-web
    pull_policy: never
    container_name: maisandbox3-web
    build:
      context: ../
      dockerfile: docker/web/Dockerfile
    restart: always
    ports:
      - 11460:11460
    # volumes:
    #   - var:/var/opt/msb:rw
    environment:
      - NODE_ENV=production
      - LAUNCHER_MODE=grpc
      - LAUNCHER_GRPC_ADDRESS=maisandbox3-runner:50051
      - LAUNCHER_GRPC_GORUN=false
      - LAUNCHER_GRPC_BINARY=
      - LAUNCHER_GRPC_DIR=
      - FRONTEND=static
    working_dir: /opt/msb
    command: npm run prod
  runner:
    image: maisandbox3-runner
    pull_policy: never
    container_name: maisandbox3-runner
    build:
      context: ../
      dockerfile: docker/base/Dockerfile
    restart: always
    user: 1000:1000
    environment:
      - LAUNCHER_CONFIGS_DIR=/opt/msb-launcher/configs
    working_dir: /opt/msb
    # command: /opt/msb/deps/applauncher-go/applauncher-go --grpc-socket /var/opt/msb/launcher-grpc.sock --workdir /tmp/msb
    command: /opt/msb-launcher/launcher --listen maisandbox3-runner:50051 --workdir /tmp/msb
